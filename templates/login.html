<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Dime Tax Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background: #f4f6f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.login-card { width: 100%; max-width: 380px; border: 1px solid #e2e8f0; border-radius: 16px; background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,.06); padding: 40px 36px; }
.brand { font-size: 28px; text-align: center; margin-bottom: 6px; }
.brand-title { text-align: center; font-weight: 700; font-size: 18px; margin-bottom: 4px; }
.brand-sub { text-align: center; font-size: 12px; color: #64748b; margin-bottom: 32px; }
.btn-brand { background: #1A7A8A; color: #fff; border: none; width: 100%; padding: 10px; font-weight: 600; border-radius: 8px; }
.btn-brand:hover { background: #155f6e; color: #fff; }
input.form-control { border-radius: 8px; font-size: 14px; }
</style>
</head>
<body>
<div class="login-card">
  <div class="brand">🐬</div>
  <div class="brand-title">Dime Tax Tracker</div>
  <div class="brand-sub">Personal US Stock Investment Tracker</div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} py-2 mb-3" style="font-size:13px;">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  <form method="post">
    <div class="mb-3">
      <label class="form-label fw-600" style="font-size:13px;font-weight:600;">Password</label>
      <input type="password" name="password" class="form-control" placeholder="Enter password" autofocus required>
    </div>
    <button type="submit" class="btn btn-brand mt-1">Sign In</button>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
